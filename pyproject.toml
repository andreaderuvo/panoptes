[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "argus-fleet"
version = "0.1.0"
description = "The fleet board for machines running Argus and AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Andrea de Ruvo" }]
keywords = ["ai-agents", "argus", "fleet", "tmux", "self-hosted", "monitoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[project.scripts]
panoptes = "argus_fleet.main:main"
argus-fleet = "argus_fleet.main:main"

[project.urls]
Homepage = "https://andreaderuvo.github.io/panoptes/"
Documentation = "https://github.com/andreaderuvo/panoptes/wiki"
Repository = "https://github.com/andreaderuvo/panoptes"
Issues = "https://github.com/andreaderuvo/panoptes/issues"

[tool.hatch.build.targets.sdist]
include = ["/app", "/static", "/LICENSE", "/README.md", "/CHANGELOG.md", "/requirements.txt"]

[tool.hatch.build.targets.wheel.force-include]
"app" = "argus_fleet"
"static" = "argus_fleet/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
