# Panoptes in a container.
#
#   docker compose up -d && docker compose logs        # the URL with the token is in there
#
# A board has nothing to reach into — no tmux, no filesystem, no terminal, no processes — so
# unlike Argus this needs no host namespaces and no matching uid. A port and a volume for the
# configuration is the whole deployment.
#
# Windows: this is the one of the two that works anywhere Docker does, WSL or not, because
# nothing in it is Unix-specific.
#
# Reaching the machines it watches: they have to be reachable *from the container*. On the
# same host, `network_mode: host` is the simplest answer; across a network, whatever address
# you would type into a browser works as it is.

services:
  panoptes:
    build: .
    # Or, once a release is published:
    # image: ghcr.io/andreaderuvo/panoptes:latest
    container_name: panoptes
    # As you, not as root. Left to itself the container writes /config/config.yaml owned by
    # root at mode 600 — and then the token, in a file in your own directory, is one you
    # cannot read. Measured, on the first run of this.
    # Not ${UID}: bash makes that variable readonly, so `UID=$(id -u) docker compose up`
    # fails outright. Its default of 1000 is right on most single-user machines; pass
    # PANOPTES_UID/PANOPTES_GID when it is not.
    user: "${PANOPTES_UID:-1000}:${PANOPTES_GID:-1000}"
    ports:
      # Loopback only, and the outside port is yours to pick: `PANOPTES_PORT=8880 docker
      # compose up -d`. Drop the `127.0.0.1:` to put it on your network.
      - "127.0.0.1:${PANOPTES_PORT:-8770}:8770"
    volumes:
      # The token, the machines you listed and the keys they gave you. Keep it: a new image
      # then changes nothing about the board.
      - ${PANOPTES_CONFIG_DIR:-./config}:/config
    restart: unless-stopped
